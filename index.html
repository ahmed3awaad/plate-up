<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate Up">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Plate Up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#121417">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-thumb phone column. Machine cards (photo-led) > tap = log sheet. Pin-stack meter is the signature detail. */
:root{
  --bg:#F1F2EF; --surface:#FFFFFF; --surface-2:#E8EAE6; --line:#D9DCD6;
  --fg:#16181B; --muted:#5F656C; --faint:#8C9298;
  --accent:#F2BE22; --accent-ink:#1B1600; --accent-text:#8A6400;
  --up:#1F8A54; --up-bg:#DDF1E5; --hold:#2E64C4; --hold-bg:#E1E9F8; --down:#C3412F; --down-bg:#F8E1DD;
  --shadow:0 1px 2px rgba(20,22,25,.06),0 8px 24px rgba(20,22,25,.06);
  --scrim:rgba(14,16,18,.45);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1A1D21; --surface-2:#23272C; --line:#2C3137;
  --fg:#ECEDEA; --muted:#9AA0A6; --faint:#6B7177;
  --accent:#F5C531; --accent-ink:#1B1600; --accent-text:#F5C531;
  --up:#4CC98A; --up-bg:#16301F; --hold:#7FAEFF; --hold-bg:#18243A; --down:#FF7E6B; --down-bg:#3A1C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1A1D21; --surface-2:#23272C; --line:#2C3137;
  --fg:#ECEDEA; --muted:#9AA0A6; --faint:#6B7177;
  --accent:#F5C531; --accent-ink:#1B1600; --accent-text:#F5C531;
  --up:#4CC98A; --up-bg:#16301F; --hold:#7FAEFF; --hold-bg:#18243A; --down:#FF7E6B; --down-bg:#3A1C17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand-name{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.unit-toggle{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.unit-toggle button{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;color:var(--muted)}
.unit-toggle button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* week summary */
.week{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:grid;gap:16px}
.week-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;justify-items:center;gap:6px}
.day span{font-size:12px;color:var(--faint);font-weight:600}
.day i{width:100%;max-width:38px;aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:block;position:relative}
.day.on i{background:var(--accent)}
.day.today span{color:var(--fg)}
.day.today i{box-shadow:inset 0 0 0 2px var(--fg)}
.day.on.today i{box-shadow:inset 0 0 0 2px var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:14px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-size:13px;color:var(--muted)}

/* section heading */
.section-h{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 12px}
.section-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.link{color:var(--accent-text);font-weight:600;font-size:15px}

.examples-note{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:var(--r-md);padding:10px 14px;font-size:14px;color:var(--muted);margin-bottom:12px}
.examples-note button{font-weight:600;color:var(--fg);white-space:nowrap}

/* machine cards */
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r-lg);padding:10px 14px 10px 10px;text-align:left;box-shadow:var(--shadow);transition:transform .15s ease}
.card:active{transform:scale(.985)}
.thumb{width:76px;height:76px;border-radius:15px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-family:var(--display);font-weight:800;font-size:28px;color:var(--muted);letter-spacing:.02em}
.thumb .ph-lines{display:none!important;position:absolute;inset:auto 10px 10px 10px;display:grid;gap:3px}
.thumb .ph-lines i{height:4px;border-radius:2px;background:var(--line);display:block}
.card-main{min-width:0;display:grid;gap:4px}
.card-name{font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-last{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-next{display:grid;justify-items:end;gap:5px}
.card-next .w{font-family:var(--display);font-weight:800;font-size:34px;line-height:.9;font-variant-numeric:tabular-nums}
.card-next .w small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px}

.pill{justify-self:start;display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px 3px 7px;border-radius:999px;white-space:nowrap}
.pill svg{width:11px;height:11px}
.pill.up{background:var(--up-bg);color:var(--up)}
.pill.hold{background:var(--hold-bg);color:var(--hold)}
.pill.down{background:var(--down-bg);color:var(--down)}
.pill.new{background:var(--surface-2);color:var(--muted)}

/* empty state */
.empty{background:var(--surface);border-radius:var(--r-lg);padding:28px 22px;box-shadow:var(--shadow);display:grid;gap:14px;justify-items:start}
.empty h3{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.empty-steps{display:grid;gap:10px;margin:4px 0 6px;padding:0;list-style:none;counter-reset:s}
.empty-steps li{display:flex;gap:12px;align-items:center;counter-increment:s}
.empty-steps li::before{content:counter(s);font-family:var(--display);font-weight:800;font-size:16px;width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;padding:14px 20px;border-radius:999px;background:var(--surface-2);transition:transform .12s ease, background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.block{width:100%}
.btn.danger{color:var(--down)}
.btn svg{width:20px;height:20px}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:14px;background:linear-gradient(to top,var(--bg) 55%,transparent);pointer-events:none}
.dock-inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;pointer-events:auto}
.tabs{flex:1;display:flex;background:var(--surface);border-radius:999px;padding:5px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:11px 0;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}
.snap{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.snap svg{width:26px;height:26px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:94%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.grabber{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-head .thumb{width:54px;height:54px;border-radius:13px}
.sheet-head .thumb .ph{font-size:20px}
.sheet-head .thumb .ph-lines{display:none}
.sheet-title{flex:1;min-width:0}
.sheet-title h3{margin:0;font-weight:700;font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.sheet-title p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}

.coach{display:grid;gap:6px;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.coach p{margin:0;font-size:15px}
.coach .why{color:var(--muted);font-size:14px}

/* weight dial */
.dial{background:var(--surface);border-radius:var(--r-lg);padding:18px 14px 16px;box-shadow:var(--shadow);display:grid;gap:14px}
.dial-row{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px}
.step{width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.step:active{transform:scale(.94)}
.dial-center{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
.weight-input{width:100%;max-width:170px;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:800;font-size:76px;line-height:1;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.weight-input::-webkit-outer-spin-button,.weight-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dial-unit{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);text-transform:uppercase;align-self:flex-end;padding-bottom:12px;margin-left:-6px}
.stack{display:grid;gap:2px;width:22px;flex:none}
.stack i{height:5px;border-radius:2px;background:var(--surface-2);display:block}
.stack i.on{background:var(--fg)}
.stack i.pin{background:var(--accent);height:5px;box-shadow:0 0 0 2px var(--accent)}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px;color:var(--fg);display:inline-flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.7}

.field{display:grid;gap:8px;margin-top:18px}
.field-h{display:flex;justify-content:space-between;align-items:baseline}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{padding:12px 0;border-radius:var(--r-sm);background:var(--surface);font-family:var(--display);font-weight:700;font-size:22px;box-shadow:var(--shadow)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;background:var(--surface);border-radius:var(--r-md);padding:6px;box-shadow:var(--shadow)}
.stepper button{height:46px;border-radius:var(--r-sm);background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:24px}
.stepper output{text-align:center;font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.stepper output small{font-size:15px;color:var(--muted);font-weight:600;margin-left:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.effort{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.effort button{background:var(--surface);border-radius:var(--r-md);padding:10px 4px 9px;display:grid;justify-items:center;gap:6px;box-shadow:var(--shadow)}
.effort b{font-weight:700;font-size:14.5px}
.effort small{font-size:12px;color:var(--muted);line-height:1.15;text-align:center}
.meter{display:flex;gap:2px;align-items:flex-end;height:18px}
.meter i{width:5px;border-radius:2px;background:var(--line);display:block}
.effort button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.effort button[aria-pressed="true"] small{color:var(--bg);opacity:.7}
.effort button[aria-pressed="true"] .meter i.on{background:var(--accent)}
.meter i.on{background:var(--fg)}
.log-cta{margin-top:22px}
.log-cta .btn{padding:18px 20px;font-size:18px}

/* detail */
.chart-box{background:var(--surface);border-radius:var(--r-lg);padding:16px 14px 10px;box-shadow:var(--shadow)}
.chart-box svg{width:100%;height:auto;display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.kpi{background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:13px}
.hist{display:grid;gap:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.hist-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.hist-row:first-child{border-top:0}
.hist-row .d{font-size:14px;color:var(--muted)}
.hist-row .v{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist-row .del{font-size:13px;font-weight:600;color:var(--faint);padding:6px 8px;border-radius:8px}
.hist-row .del.armed{color:var(--down);background:var(--down-bg)}
.eff-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.settings{display:grid;gap:4px}
.text-input{width:100%;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-size:17px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}

/* add */
.photo-drop{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;border-radius:var(--r-lg);background:var(--surface);border:2px dashed var(--line);cursor:pointer;overflow:hidden;position:relative;text-align:center}
.photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-drop .cta{display:grid;justify-items:center;gap:10px;padding:20px}
.photo-drop .cam{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.photo-drop .cam svg{width:28px;height:28px}
.photo-drop b{font-size:18px}
.photo-drop small{color:var(--muted)}
.photo-drop.has{border-style:solid;border-color:transparent}
.retake{position:absolute;right:12px;bottom:12px;background:var(--scrim);color:#fff;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;backdrop-filter:blur(6px)}
.ai-note{font-size:14px;color:var(--muted);min-height:1.4em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* guide */
.guide{display:grid;gap:12px}
.g-hero{background:var(--fg);color:var(--bg);border-radius:var(--r-lg);padding:22px 20px;display:grid;gap:10px}
.g-hero h2{margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:.95;text-transform:uppercase;text-wrap:balance}
.g-hero p{margin:0;opacity:.8;max-width:46ch}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.rung{background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:12px;padding:10px 8px;display:grid;gap:2px}
.rung b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.rung small{font-size:12px;opacity:.75}
.rung.go{background:var(--accent);color:var(--accent-ink)}
.g-card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);display:grid;gap:8px}
.g-card h3{margin:0;font-weight:700;font-size:18px}
.g-card p{margin:0;color:var(--muted);font-size:15.5px;max-width:62ch}
.g-card ul{margin:0;padding-left:18px;color:var(--muted);font-size:15.5px;display:grid;gap:4px}
.g-card strong{color:var(--fg)}
.g-table{width:100%;border-collapse:collapse;font-size:15px}
.g-table td{padding:8px 0;border-top:1px solid var(--line)}
.g-table td:last-child{text-align:right;font-family:var(--display);font-weight:700;font-size:18px}
.g-table tr:first-child td{border-top:0}

/* hero snap */
.snap-hero{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r-lg);padding:18px 20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease}
.snap-hero:active{transform:scale(.98)}
.snap-hero .cam{width:58px;height:58px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center}
.snap-hero .cam svg{width:28px;height:28px}
.snap-hero b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.snap-hero small{font-size:15px;font-weight:500;opacity:.75}
.snap-hero .arrow{font-family:var(--display);font-weight:800;font-size:28px}
.snap-hero.big{grid-template-columns:1fr;justify-items:center;text-align:center;padding:44px 24px 40px;gap:18px}
.snap-hero.big .cam{width:96px;height:96px}
.snap-hero.big .cam svg{width:44px;height:44px}
.snap-hero.big b{font-size:40px}
.snap-hero.big .arrow{display:none}
.week-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 2px 0;font-size:14.5px;color:var(--muted)}
.week-line .dots{display:flex;gap:4px}
.week-line .dots i{width:9px;height:9px;border-radius:3px;background:var(--surface-2);display:block}
.week-line .dots i.on{background:var(--accent)}
.week-line strong{color:var(--fg)}
.week-line .up{color:var(--up);font-weight:600}
.under{display:flex;justify-content:center;margin-top:14px}
.big-weight{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow)}
.big-weight output{text-align:center;font-family:var(--display);font-weight:800;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big-weight output small{font-size:18px;color:var(--muted);font-weight:700;margin-left:4px;text-transform:uppercase}
.big-weight input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:800;font-size:56px;line-height:1;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.big-weight input::-webkit-outer-spin-button,.big-weight input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.big-weight .mid{display:flex;align-items:baseline;justify-content:center;min-width:0}
.big-weight .mid small{font-family:var(--display);font-size:18px;color:var(--muted);font-weight:700;text-transform:uppercase}
.steps{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.steps .lbl{font-size:13px;color:var(--muted);font-weight:600;margin-right:2px}
.steps .chip{padding:7px 12px}
.hint{font-size:13px;color:var(--faint);text-align:center;margin:0}
.hdr-actions{display:flex;align-items:center;gap:8px}

/* swipe to delete */
.swipe{position:relative;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.swipe .card{position:relative;z-index:1;width:100%;touch-action:pan-y;box-shadow:none;-webkit-user-select:none;user-select:none}
.del-btn{position:absolute;inset:0;z-index:0;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding-right:26px;background:var(--down);color:#fff;font-weight:700;font-size:16px;border-radius:var(--r-lg)}
.del-btn svg{width:20px;height:20px}
.swipe:not(.moving) .del-btn{visibility:hidden}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);border-radius:999px;padding:12px 10px 12px 18px;display:flex;gap:14px;align-items:center;font-weight:600;font-size:15px;box-shadow:var(--shadow);max-width:calc(100% - 32px);width:max-content;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast button{color:var(--accent);font-weight:700;padding:4px 10px}
.toast:not(:has(button)){padding-right:18px}
.sync{font-size:12.5px;color:var(--faint);text-align:center;margin-top:28px}

@media (max-width:380px){
  .card{grid-template-columns:64px 1fr auto;gap:10px}
  .thumb{width:64px;height:64px}
  .card-next .w{font-size:28px}
  .weight-input{font-size:64px}
  .step{width:54px;height:54px}
  .dial-row{grid-template-columns:54px 1fr 54px}
  .effort small{font-size:11px}
}
</style>

<div class="app" id="app"></div>
<input id="snap-in" class="sr" type="file" accept="image/*" capture="environment" aria-label="Take a photo of a machine">
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { const v = Math.round(n * 100) / 100; return Number.isInteger(v) ? String(v) : String(v); };
const fmtK = n => n >= 10000 ? (Math.round(n / 100) / 10) + 'k' : Math.round(n).toLocaleString();
const DAY = 86400000;
const num = v => parseFloat(String(v ?? '').replace(',', '.'));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const ago = t => {
  const d = Math.floor((startOfDay(Date.now()) - startOfDay(t)) / DAY);
  if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 7) return d + ' days ago';
  if (d < 14) return '1 week ago'; if (d < 60) return Math.floor(d / 7) + ' weeks ago';
  return Math.floor(d / 30) + ' months ago';
};
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const dateLabel = t => new Date(t).toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });

const EFFORT = [
  { v:1, label:'Easy',    sub:'4+ reps left' },
  { v:2, label:'Solid',   sub:'2–3 left' },
  { v:3, label:'Hard',    sub:'1 left' },
  { v:4, label:'All out', sub:'0 left' },
];
const EFFORT_COLOR = ['', 'var(--up)', 'var(--hold)', 'var(--accent)', 'var(--down)'];
const NAMES = ['Leg Press','Chest Press','Lat Pulldown','Seated Row','Shoulder Press','Leg Extension','Leg Curl','Pec Fly','Rear Delt Fly','Hip Abductor','Hip Adductor','Calf Raise','Bicep Curl','Tricep Pushdown','Smith Squat','Hack Squat'];
const RANGES = [ { k:'strength', label:'Strength', min:4, max:6 }, { k:'build', label:'Muscle', min:8, max:12 }, { k:'endure', label:'Endurance', min:12, max:15 } ];

const ICON = {
  up: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5"/></svg>',
  down: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v8M2.5 6.5 6 10l3.5-3.5"/></svg>',
  hold: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 6h8"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
};

/* ---------- state + storage ---------- */
const LS = 'plateup.machines.v1';
const state = {
  machines: lsGet(LS, []),
  unit: lsGet('plateup.unit', 'kg'),
  tab: 'machines',
  cloud: null,       // collection ref when signed in
  sample: null,
};
const chains = {};
function saveLocal() { lsSet(LS, state.machines); }
function persist(m) {
  saveLocal();
  if (!state.cloud) return;
  const body = JSON.parse(JSON.stringify(m)); delete body.id;
  chains[m.id] = (chains[m.id] || Promise.resolve())
    .then(() => state.cloud.doc(m.id).set(body))
    .catch(() => toast('Saved on this phone. Your account sync will retry next time.'));
}
function removeMachine(id) {
  state.machines = state.machines.filter(m => m.id !== id);
  saveLocal();
  if (state.cloud) chains[id] = (chains[id] || Promise.resolve()).then(() => state.cloud.doc(id).delete()).catch(() => {});
}
const byId = id => state.machines.find(m => m.id === id);

async function connect() {
  const c = window.claude;
  if (!c?.use) return;
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (db && user) {
      const id = await user.id();
      if (id) {
        const col = db.collection('data/users/' + id);
        let migrated = false;
        col.onSnapshot(snap => {
          if (!migrated && !snap.metadata.fromCache) {
            migrated = true;
            if (snap.empty && state.machines.length) {
              state.cloud = col;
              state.machines.forEach(persist);
              render();
              return;
            }
          }
          if (snap.metadata.fromCache && snap.empty) return;
          state.cloud = col;
          state.machines = snap.docs.map(d => ({ ...JSON.parse(JSON.stringify(d.data())), id: d.id }));
          saveLocal();
          render();
          refreshSheet();
        }, () => { state.cloud = null; render(); });
      }
    }
  } catch {}
  try {
    const s = await c.use('sample');
    if (s) { const lim = await s.limits?.(); if (!lim || lim.images) state.sample = s; }
  } catch {}
}

/* ---------- progression engine ---------- */
function roundTo(w, inc) { const step = inc >= 2.5 ? 0.5 : 0.25; return Math.max(0, Math.round(w / step) * step); }
function suggest(m) {
  const s = m.sessions || [];
  const last = s[s.length - 1];
  const inc = m.inc, u = m.unit;
  if (!last) return { status:'new', w:m.start, reps:m.repMin, sets:m.sets || 3,
    title:'First session', msg:`Start at ${fmt(m.start)} ${u}. Pick a weight you can do for ${m.repMin}–${m.repMax} clean reps.` };
  // how long at this weight
  let i = s.length - 1; while (i > 0 && s[i - 1].w === last.w) i--;
  const streak = s.length - i, days = Math.floor((Date.now() - s[i].t) / DAY);
  const sets = last.sets;
  const top = m.repMax, bot = m.repMin;
  if (last.effort === 4 && last.reps < bot)
    return { status:'down', w:roundTo(last.w - inc, inc), reps:bot, sets,
      title:`Drop to ${fmt(roundTo(last.w - inc, inc))} ${u}`, msg:`You went all out and fell short of ${bot} reps. Drop ${fmt(inc)} ${u}, rebuild clean reps, then climb back.` };
  if (last.reps >= top && last.effort <= 3)
    return { status:'up', w:roundTo(last.w + inc, inc), reps:bot, sets,
      title:`Go up to ${fmt(roundTo(last.w + inc, inc))} ${u}`, msg:`You hit ${top} reps, the top of your range. Add ${fmt(inc)} ${u} and start again at ${bot} reps.` };
  if (last.effort === 1 && last.reps >= bot)
    return { status:'up', w:roundTo(last.w + inc, inc), reps:Math.max(bot, last.reps - 2), sets,
      title:`Go up to ${fmt(roundTo(last.w + inc, inc))} ${u}`, msg:`That felt easy with 4+ reps left. You're ready for ${fmt(inc)} ${u} more.` };
  if (days >= 14 && last.effort <= 2 && last.reps >= bot)
    return { status:'up', w:roundTo(last.w + inc, inc), reps:bot, sets,
      title:`Time to go up`, msg:`${days} days at ${fmt(last.w)} ${u} and it still feels solid. Add ${fmt(inc)} ${u} to keep progressing.` };
  const reset = Math.max(inc, Math.round(last.w * 0.9 / inc) * inc);
  if (streak >= 4 && last.effort >= 3 && last.reps < top && last.reps <= s[i].reps + 1 && reset < last.w)
    return { status:'down', w:reset, reps:top, sets,
      title:`Reset to ${fmt(reset)} ${u}`, msg:`${streak} sessions stuck at ${fmt(last.w)} ${u}. Drop about 10%, go for ${top} reps, and build back up. Stalls break this way.` };
  if (last.reps < bot)
    return { status:'hold', w:last.w, reps:bot, sets,
      title:`Stay at ${fmt(last.w)} ${u}`, msg:`Aim for ${bot} reps per set. Once you hit ${top}, the weight goes up.` };
  const next = Math.min(last.reps + 1, top);
  return { status:'hold', w:last.w, reps:next, sets,
    title:`Stay at ${fmt(last.w)} ${u}, aim for ${next}`, msg:`Add one rep before adding weight. At ${top} reps per set you go up ${fmt(inc)} ${u}.` };
}
const STATUS = { up:['up','Go up'], hold:['hold','Hold'], down:['down','Drop'], new:['new','New'] };
const pill = st => { const [c, t] = STATUS[st]; return `<span class="pill ${c}">${ICON[c] || ''}${t}</span>`; };

/* ---------- pieces ---------- */
function thumb(m) {
  if (m.photo) return `<div class="thumb"><img src="${m.photo}" alt=""></div>`;
  const ini = m.name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  return `<div class="thumb" aria-hidden="true"><span class="ph">${esc(ini)}</span><span class="ph-lines"><i></i><i></i><i></i></span></div>`;
}
function stackMeter(m, w) {
  const all = (m.sessions || []).map(s => s.w).concat([m.start, w]);
  const max = Math.max(...all) * 1.35 || 1;
  const n = 14, lvl = Math.max(1, Math.min(n, Math.round(w / max * n)));
  let h = '';
  for (let i = n; i >= 1; i--) h += `<i class="${i === lvl ? 'pin' : i < lvl ? 'on' : ''}"></i>`;
  return `<div class="stack" aria-hidden="true" title="Pin position on the weight stack">${h}</div>`;
}
function meter(v) { let h = ''; for (let i = 1; i <= 4; i++) h += `<i class="${i <= v ? 'on' : ''}" style="height:${4 + i * 3.5}px"></i>`; return `<span class="meter">${h}</span>`; }

/* ---------- render: home ---------- */
function weekStats() {
  const now = new Date(); const dow = (now.getDay() + 6) % 7; // Mon=0
  const mon = startOfDay(Date.now()) - dow * DAY;
  const days = Array.from({ length:7 }, (_, i) => ({ t: mon + i * DAY, on:false, today: i === dow }));
  let sessions = 0, volume = 0; const sessionDays = new Set();
  state.machines.forEach(m => (m.sessions || []).forEach(s => {
    if (s.t >= mon) { sessions++; volume += s.w * s.reps * s.sets; const k = startOfDay(s.t); sessionDays.add(k); }
  }));
  days.forEach(d => d.on = sessionDays.has(d.t));
  const ready = state.machines.filter(m => suggest(m).status === 'up').length;
  return { days, sessions, volume, ready, trainDays: sessionDays.size };
}
function renderHome() {
  const ms = state.machines;
  if (!ms.length) return `
    <label class="snap-hero big" for="snap-in">
      <span class="cam">${ICON.cam}</span>
      <span><b>Snap a machine</b><small>Take a photo of the machine you’re on.<br>Plate Up remembers the weight for next time.</small></span>
    </label>
    <div class="under"><button class="link" data-act="examples">Or see an example first</button></div>`;
  const w = weekStats();
  let h = `
  <label class="snap-hero" for="snap-in">
    <span class="cam">${ICON.cam}</span>
    <span><b>Snap a machine</b><small>Add a new one</small></span>
    <span class="arrow" aria-hidden="true">→</span>
  </label>
  <div class="week-line">
    <span class="dots" aria-hidden="true">${w.days.map(d => `<i class="${d.on ? 'on' : ''}"></i>`).join('')}</span>
    <span><strong>${w.trainDays}</strong> ${w.trainDays === 1 ? 'day' : 'days'} this week</span>
    ${w.ready ? `<span>·</span><span class="up">${w.ready} ready to go up</span>` : ''}
  </div>`;
  const order = { up:0, down:1, hold:2, new:3 };
  const sorted = ms.slice().sort((a, b) => {
    const la = a.sessions?.at(-1)?.t || a.createdAt, lb = b.sessions?.at(-1)?.t || b.createdAt;
    return (order[suggest(a).status] - order[suggest(b).status]) || (lb - la);
  });
  h += `<div class="section-h"><h2>Your machines</h2></div>`;
  if (ms.some(m => m.example)) h += `<div class="examples-note"><span>Example machines with made-up history.</span><button data-act="clear-examples">Remove</button></div>`;
  h += `<div class="list">` + sorted.map(m => {
    const s = suggest(m), last = m.sessions?.at(-1);
    const lastTxt = last ? `Last ${fmt(last.w)} ${m.unit} · ${ago(last.t)}` : 'Tap to log your first set';
    return `<div class="swipe"><button class="del-btn" data-delete="${m.id}" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>Delete</button><button class="card" data-open="${m.id}">
      ${thumb(m)}
      <span class="card-main"><span class="card-name">${esc(m.name)}</span><span class="card-last">${esc(lastTxt)}</span>${pill(s.status)}</span>
      <span class="card-next"><span class="eyebrow" style="font-size:11px">Next</span><span class="w">${fmt(s.w)}<small>${esc(m.unit)}</small></span></span>
    </button></div>`;
  }).join('') + `</div>`;
  if (ms.length) h += `<p class="sync" style="margin-top:14px">Swipe a machine left to delete it</p>`;
  h += `<p class="sync" style="margin-top:4px">${state.cloud ? 'Saved to your Claude account' : 'Saved on this phone'}</p>`;
  return h;
}

/* ---------- render: guide ---------- */
function renderGuide() {
  const u = state.unit;
  const big = u === 'kg' ? '5–10 kg' : '10–20 lb', small = u === 'kg' ? '2.5–5 kg' : '5–10 lb', tiny = u === 'kg' ? '1–2.5 kg' : '2.5–5 lb';
  return `<div class="guide">
    <section class="g-hero">
      <span class="eyebrow" style="color:inherit;opacity:.7">How Plate Up decides</span>
      <h2>Reps first. Then weight.</h2>
      <p>This is called double progression. Pick a rep range, say 8–12. Keep the same weight and add reps each session. When every set reaches the top of the range, add weight and drop back to the bottom.</p>
      <div class="ladder">
        <div class="rung"><b>8</b><small>40 ${u === 'kg' ? 'kg' : 'lb'}</small></div>
        <div class="rung"><b>10</b><small>40 ${u === 'kg' ? 'kg' : 'lb'}</small></div>
        <div class="rung"><b>12</b><small>40 ${u === 'kg' ? 'kg' : 'lb'}</small></div>
        <div class="rung go"><b>8</b><small>45 ${u === 'kg' ? 'kg' : 'lb'}</small></div>
      </div>
    </section>
    <section class="g-card"><h3>When to add weight</h3>
      <ul>
        <li><strong>You hit the top of your rep range</strong> on all sets with at least 1 rep left in the tank.</li>
        <li><strong>It felt easy</strong>, with 4 or more reps left.</li>
        <li><strong>Two weeks at the same weight</strong> and it still feels solid. Most people stall by staying comfortable, not by lifting too much.</li>
      </ul></section>
    <section class="g-card"><h3>How much to add</h3>
      <table class="g-table"><tbody>
        <tr><td>Big legs and back machines<br><small style="color:var(--muted)">Leg press, hack squat, row</small></td><td>${big}</td></tr>
        <tr><td>Chest, back, shoulder presses</td><td>${small}</td></tr>
        <tr><td>Small muscles<br><small style="color:var(--muted)">Curls, raises, extensions</small></td><td>${tiny}</td></tr>
      </tbody></table>
      <p>Machines jump one plate at a time. If the jump is too big, stay and earn an extra rep or two first.</p></section>
    <section class="g-card"><h3>Sets and reps</h3>
      <ul>
        <li><strong>3 working sets</strong> per machine is the sweet spot for most people. 2 works when you are short on time.</li>
        <li><strong>8–12 reps</strong> builds muscle. 4–6 builds strength. 12–15 for endurance and small muscles.</li>
        <li>Rest 1.5–3 minutes between sets so the next one counts.</li>
      </ul></section>
    <section class="g-card"><h3>Reading your effort</h3>
      <p>Effort is measured in reps left in the tank (RIR). Tap the one that matches your last set.</p>
      <table class="g-table"><tbody>
        ${EFFORT.map(e => `<tr><td><span class="eff-dot" style="background:${EFFORT_COLOR[e.v]}"></span>${e.label}</td><td style="font-family:var(--body);font-weight:500;font-size:15px;color:var(--muted)">${e.sub}</td></tr>`).join('')}
      </tbody></table>
      <p>Most sets should land on <strong>Solid</strong> or <strong>Hard</strong>. All out is fine on the last set, not every set.</p></section>
    <section class="g-card"><h3>When you stall</h3>
      <p>Stuck at the same weight for 4 sessions and every set is a grind? Drop about 10%, push the reps up, and climb back. Plate Up suggests this for you. Sleep, food and a deload week every 6–8 weeks also matter.</p></section>
    <p class="sync">General training guidance, not medical advice. Stop if something hurts.</p>
  </div>`;
}

function render() {
  const app = $('#app');
  const guide = state.tab === 'guide';
  const head = `<header class="top">
    ${guide ? `<button class="btn" data-tab="machines" style="padding:10px 16px">← Back</button>` :
    `<div class="brand"><span class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"><path d="M6 6v12M18 6v12M2.5 9.5v5M21.5 9.5v5M6 12h12"/></svg></span><span class="brand-name">Plate Up</span></div>`}
    <div class="hdr-actions">
      <div class="unit-toggle" role="group" aria-label="Units"><button data-unit="kg" aria-pressed="${state.unit === 'kg'}">kg</button><button data-unit="lb" aria-pressed="${state.unit === 'lb'}">lb</button></div>
      ${guide ? '' : `<button class="icon-btn" data-tab="guide" aria-label="How it works" style="font-family:var(--display);font-weight:800;font-size:19px">?</button>`}
    </div>
  </header>`;
  openRow = null;
  app.innerHTML = head + (guide ? renderGuide() : renderHome());
}

/* ---------- sheets ---------- */
let sheet = null; // { kind, id, draft }
function openSheet(kind, opts = {}) { sheet = { kind, ...opts }; drawSheet(true); }
function closeSheet() { sheet = null; $('#sheet-root').innerHTML = ''; document.body.style.overflow = ''; }
function refreshSheet() { if (sheet && sheet.kind !== 'add') { if (!byId(sheet.id)) return closeSheet(); drawSheet(false); } }
function drawSheet(fresh) {
  const root = $('#sheet-root');
  const scroll = root.querySelector('.sheet')?.scrollTop || 0;
  const inner = sheet.kind === 'log' ? logSheet() : sheet.kind === 'detail' ? detailSheet() : addSheet();
  root.innerHTML = `<div class="sheet-wrap" role="dialog" aria-modal="true"><div class="scrim" data-act="close"></div><div class="sheet" style="${fresh ? '' : 'animation:none'}"><div class="grabber"></div>${inner}</div></div>`;
  const s = root.querySelector('.sheet'); if (!fresh) s.scrollTop = scroll;
  root.querySelector('.scrim').style.animation = fresh ? '' : 'none';
  document.body.style.overflow = 'hidden';
  if (sheet.kind === 'add') wireAdd();
  if (sheet.kind === 'log') wireLog();
}

/* log */
function logSheet() {
  const m = byId(sheet.id); const s = suggest(m);

</div>

function wireLog() {

function updateLogBtn() {

/* detail */
function chartSvg(m) {
  const s = m.sessions || [];
  if (s.length < 2) return `<p style="margin:6px 4px 10px;color:var(--muted);font-size:15px">Your progress chart appears after two sessions.</p>`;
  const W = 340, H = 150, pl = 34, pr = 12, pt = 14, pb = 26;
  const ws = s.map(x => x.w); let lo = Math.min(...ws), hi = Math.max(...ws);
  if (hi === lo) { hi += m.inc; lo = Math.max(0, lo - m.inc); }
  const pad = (hi - lo) * 0.15; lo = Math.max(0, lo - pad); hi += pad;
  const t0 = s[0].t, t1 = s.at(-1).t || t0 + 1;
  const X = t => pl + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (W - pl - pr);
  const Y = w => pt + (1 - (w - lo) / (hi - lo)) * (H - pt - pb);
  const pts = s.map(x => [X(x.t), Y(x.w)]);
  // step line: weight holds until changed
  let d = `M${pts[0][0]},${pts[0][1]}`; for (let i = 1; i < pts.length; i++) d += ` H${pts[i][0]} V${pts[i][1]}`;
  const area = d + ` V${H - pb} H${pts[0][0]} Z`;
  const ticks = [lo + (hi - lo) * 0.15 / 1.3, hi - (hi - lo) * 0.15 / 1.3].map(v => roundTo(v, m.inc));
  const uniq = [...new Set(ticks)];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time for ${esc(m.name)}">
    ${uniq.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--body)">${fmt(v)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity=".16"/>
    <path d="${d}" fill="none" stroke="var(--fg)" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5.5 : 3.6}" fill="${EFFORT_COLOR[s[i].effort]}" stroke="var(--surface)" stroke-width="1.6"/>`).join('')}
    <text x="${pl}" y="${H - 6}" font-size="11" fill="var(--muted)" font-family="var(--body)">${new Date(t0).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>
    <text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--body)">${new Date(t1).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>
  </svg>`;
}
function detailSheet() {

  return `
  <div class="sheet-head">${thumb(m)}<div class="sheet-title"><h3>${esc(m.name)}</h3><p>${s.length} session${s.length === 1 ? '' : 's'} since ${new Date(m.createdAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</p></div>
    <button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div>
  <div class="chart-box">${chartSvg(m)}
    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:4px 4px 2px">${EFFORT.map(e => `<span><span class="eff-dot" style="background:${EFFORT_COLOR[e.v]}"></span>${e.label}</span>`).join('')}</div></div>
  <div class="kpis">
    <div class="kpi"><b>${fmt(best)}</b><small>best ${esc(m.unit)}</small></div>
    <div class="kpi"><b style="color:${gain > 0 ? 'var(--up)' : 'inherit'}">${gain > 0 ? '+' : ''}${fmt(gain)}</b><small>${esc(m.unit)} gained</small></div>
    <div class="kpi"><b>${pct > 0 ? '+' : ''}${pct}%</b><small>stronger</small></div>
  </div>
  <div class="row" style="margin:14px 0 4px"><button class="btn primary block" data-act="to-log">Log a session</button></div>
  ${s.length ? `<div class="section-h"><h2 style="font-size:18px">History</h2></div>
  <div class="hist">${s.slice().reverse().map(x => `<div class="hist-row">
      <span class="d"><span class="eff-dot" style="background:${EFFORT_COLOR[x.effort]}"></span>${dateLabel(x.t)} · ${EFFORT[x.effort - 1].label}</span>
      <span class="v">${fmt(x.w)} ${esc(m.unit)} · ${x.sets}×${x.reps}</span>
      <button class="del ${arm === x.id ? 'armed' : ''}" data-delsess="${x.id}">${arm === x.id ? 'Delete?' : 'Remove'}</button></div>`).join('')}</div>` : ''}

    <div class="field"><span class="eyebrow">Weight step</span><div class="chips-wrap">${incOptions(m.unit).map(v => `<button class="chip" data-inc="${v}" aria-pressed="${v === m.inc}">+${fmt(v)} ${m.unit}</button>`).join('')}</div></div>
    <div class="field"><span class="eyebrow">Goal</span><div class="chips-wrap">${RANGES.map(r => `<button class="chip" data-range="${r.k}" aria-pressed="${m.repMin === r.min && m.repMax === r.max}"><small>${r.label}</small>${r.min}–${r.max} reps</button>`).join('')}</div></div>
    <div class="field"><span class="eyebrow">Photo</span><label class="btn" for="rephoto" style="justify-self:start">${ICON.cam}${m.photo ? 'Retake photo' : 'Add photo'}</label><input id="rephoto" class="sr" type="file" accept="image/*" capture="environment"></div>
    <div class="field"><button class="btn danger" data-act="del-machine" style="justify-self:start">${sheet.armMachine ? 'Tap again to delete this machine and its history' : 'Delete machine'}</button></div>
  </div>`;
}
const incOptions = u => u === 'kg' ? [1, 2.5, 5, 10] : [2.5, 5, 10, 20];
const stepChips = (u, cur, key) => `<div class="steps" role="group" aria-label="Weight step"><span class="lbl">Step</span>${incOptions(u).map(v => `<button class="chip" data-${key}="${v}" aria-pressed="${v === cur}">${fmt(v)}</button>`).join('')}<span class="lbl" style="margin-left:2px">${u}</span></div>`;

function wireAdd() {
  const w = $('#start-in');
  w?.addEventListener('input', () => { const v = num(w.value); if (!isNaN(v) && v >= 0) sheet.draft.start = v; });
  w?.addEventListener('focus', () => w.select());
  const n = $('#name-in');
  n?.addEventListener('input', () => { sheet.draft.name = n.value; document.querySelectorAll('[data-name]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.name === n.value))); });
}
async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((r, j) => { img.onload = r; img.onerror = j; img.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), S = 420;
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    const dataUrl = c.toDataURL('image/jpeg', 0.72);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
    return { dataUrl, blob };
  } finally { URL.revokeObjectURL(url); }
}
async function identify(blob) {
  if (!state.sample || !blob) return;
  const note = () => $('#ai-note');
  sheet.draft.ai = 'Recognising the machine…'; if (note()) note().textContent = sheet.draft.ai;
  try {
    const r = await state.sample.json(
      'This is a photo taken in a gym. Identify the exercise machine or equipment. Reply with JSON only: {"name": string, "kind": "legs"|"upper"|"small"}. "name" is the common short name in Title Case, 2-3 words, like "Leg Press", "Lat Pulldown", "Chest Press", "Seated Row". If it is not gym equipment use "name": "".',
      { images:[blob], modelTier:'quick' });
    const nm = (r && typeof r.name === 'string') ? r.name.trim().slice(0, 40) : '';
    if (!sheet || sheet.kind !== 'add') return;
    if (nm) {
      if (!sheet.draft.name) sheet.draft.name = nm;
      if (state.unit === 'kg') sheet.draft.inc = r.kind === 'legs' ? 10 : r.kind === 'small' ? 2.5 : 5;
      else sheet.draft.inc = r.kind === 'legs' ? 20 : r.kind === 'small' ? 5 : 10;
      sheet.draft.ai = `Looks like a ${nm}. Change the name if that's wrong.`;
    } else sheet.draft.ai = 'Couldn’t recognise it. Type a name below.';
  } catch (e) {
    sheet.draft.ai = '';
    if (e?.code === 'not_granted') state.sample = null;
  }
  if (sheet?.kind === 'add') drawSheet(false);
}

/* ---------- examples ---------- */
function makeExamples() {
  const now = Date.now(), k = state.unit === 'kg';
  const mk = (name, start, inc, rows) => {
    const sessions = rows.map(([daysAgo, w, reps, effort]) => ({ id:uid(), t: now - daysAgo * DAY - 3600e3 * 2, w: k ? w : roundTo(w * 2.2, 5), sets:3, reps, effort }));
    return { id:uid(), name, photo:null, unit:state.unit, inc: k ? inc : inc * 2, repMin:8, repMax:12, sets:3, start: k ? start : start * 2, createdAt: sessions[0].t - DAY, example:true, sessions };
  };
  return [
    mk('Leg Press', 100, 10, [[33,100,8,3],[30,100,9,3],[26,100,11,2],[23,100,12,2],[19,110,8,3],[16,110,9,3],[12,110,10,2],[9,110,11,2],[5,110,12,2]]),
    mk('Lat Pulldown', 40, 5, [[32,40,9,3],[28,40,10,2],[25,40,12,3],[21,45,8,3],[18,45,9,3],[14,45,10,3],[11,45,10,3],[7,45,11,2],[3,45,11,3]]),
    mk('Chest Press', 35, 5, [[31,35,10,2],[27,35,12,2],[24,40,9,3],[20,40,10,3],[17,40,10,4],[13,40,9,4],[10,40,9,4],[6,40,8,4],[2,40,7,4]]),
  ];
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo) {
  const r = $('#toast-root'); clearTimeout(toastTimer);
  r.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undo ? '<button data-act="undo">Undo</button>' : ''}</div>`;
  r._undo = undo;
  toastTimer = setTimeout(() => { r.innerHTML = ''; r._undo = null; }, 5000);
}

/* ---------- swipe to delete ---------- */
let swipe = null, openRow = null, suppressClick = false;
const OPEN_X = -104;
function setX(card, x, anim) {
  card.style.transition = anim ? 'transform .24s cubic-bezier(.2,.8,.2,1)' : 'none';
  card.style.transform = x ? `translateX(${x}px)` : '';
  const row = card.parentElement; clearTimeout(row._t);
  if (x) row.classList.add('moving'); else row._t = setTimeout(() => row.classList.remove('moving'), anim ? 260 : 0);
}
function closeOpen(except) { if (openRow && openRow !== except) { setX(openRow, 0, true); openRow = null; } }
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.swipe .card');
  if (!card) { if (!e.target.closest('.del-btn')) closeOpen(); return; }
  const wasOpen = openRow === card;
  closeOpen(card);
  swipe = { card, x0:e.clientX, y0:e.clientY, base: wasOpen ? OPEN_X : 0, x: wasOpen ? OPEN_X : 0, active:false, id:e.pointerId };
});
document.addEventListener('pointermove', e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
  if (!swipe.active) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) { swipe.active = true; try { swipe.card.setPointerCapture(e.pointerId); } catch {} }
    else if (Math.abs(dy) > 10) { swipe = null; return; }
    else return;
  }
  swipe.x = Math.min(0, swipe.base + dx);
  setX(swipe.card, swipe.x, false);
});
function endSwipe() {
  if (!swipe) return;
  const s = swipe; swipe = null;
  if (!s.active) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 350);
  const w = s.card.offsetWidth;
  if (s.x < -w * 0.6) { setX(s.card, -w, true); const id = s.card.dataset.open; setTimeout(() => deleteMachine(id), 180); }
  else if (s.x < OPEN_X / 2) { setX(s.card, OPEN_X, true); openRow = s.card; }
  else { setX(s.card, 0, true); if (openRow === s.card) openRow = null; }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', endSwipe);
function deleteMachine(id) {
  const m = byId(id); if (!m) return;
  const copy = JSON.parse(JSON.stringify(m));
  removeMachine(id); render();
  toast(`${m.name} deleted`, () => { if (byId(copy.id)) return; state.machines.push(copy); persist(copy); render(); });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-act]'); if (!t) return;
  const ds = t.dataset;
  if (suppressClick) return;
  if (ds.delete) { deleteMachine(ds.delete); return; }
  if (ds.open && openRow) { closeOpen(); return; }

  if (ds.tab) { state.tab = ds.tab; render(); window.scrollTo({ top:0 }); return; }
  if (ds.unit && ds.unit !== state.unit) { switchUnit(ds.unit); return; }
  if (ds.open) { openSheet('log', { id: ds.open }); return; }
  if (ds.act === 'add') { $('#snap-in').click(); return; }

  switch (ds.act) {
    case 'close': closeSheet(); return;
    case 'examples': state.machines = makeExamples().concat(state.machines); state.machines.forEach(persist); render(); toast('Loaded 3 example machines'); return;
    case 'clear-examples': state.machines.filter(m => m.example).forEach(m => removeMachine(m.id)); render(); toast('Examples removed'); return;
    case 'detail': sheet = { kind:'detail', id: sheet.id }; drawSheet(false); return;
    case 'to-log': sheet = { kind:'log', id: sheet.id }; drawSheet(false); return;
    case 'undo': { const r = $('#toast-root'); r._undo?.(); r.innerHTML = ''; return; }
    case 'log': return doLog();
    case 'save-machine': return saveMachine();
    case 'del-machine': {
      if (!sheet.armMachine) { sheet.armMachine = true; drawSheet(false); return; }
      const m = byId(sheet.id); removeMachine(m.id); closeSheet(); render(); toast(`${m.name} deleted`); return;
    }
  }

  if (!sheet) return;
  const m = sheet.id && byId(sheet.id);
  if (sheet.kind === 'log' && m) {
    const d = sheet.draft;
    if (ds.w) { const tv = num($('#w-input').value); if (!isNaN(tv)) d.w = tv; d.w = roundTo(Math.max(0, d.w + parseFloat(ds.w) * m.inc), m.inc); $('#w-input').value = fmt(d.w); updateLogBtn(); return; }
    if (ds.loginc) { m.inc = parseFloat(ds.loginc); persist(m); document.querySelectorAll('[data-loginc]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); document.querySelectorAll('.step[data-w]').forEach(b => b.setAttribute('aria-label', (b.dataset.w > 0 ? 'Plus ' : 'Minus ') + fmt(m.inc) + ' ' + m.unit)); return; }
    if (ds.setw) { d.w = parseFloat(ds.setw); $('#w-input').value = fmt(d.w); updateLogBtn(); return; }
    if (ds.sets) { d.sets = Math.min(10, Math.max(1, d.sets + +ds.sets)); $('#sets-out').textContent = d.sets; updateLogBtn(); return; }
    if (ds.reps) { d.reps = Math.min(50, Math.max(1, d.reps + +ds.reps)); $('#reps-out').textContent = d.reps; updateLogBtn(); return; }
    if (ds.eff) { d.effort = +ds.eff; document.querySelectorAll('[data-eff]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
  }
  if (sheet.kind === 'detail' && m) {
    if (ds.delsess) {
      if (sheet.arm !== ds.delsess) { sheet.arm = ds.delsess; drawSheet(false); return; }
      m.sessions = m.sessions.filter(x => x.id !== ds.delsess); sheet.arm = null; persist(m); drawSheet(false); render(); return;
    }
    if (ds.inc) { m.inc = parseFloat(ds.inc); persist(m); drawSheet(false); render(); return; }
    if (ds.range) { const r = RANGES.find(x => x.k === ds.range); m.repMin = r.min; m.repMax = r.max; persist(m); drawSheet(false); render(); return; }
  }
  if (sheet.kind === 'add') {
    const d = sheet.draft;
    if (ds.name) { d.name = ds.name; $('#name-in').value = d.name; document.querySelectorAll('[data-name]').forEach(c => c.setAttribute('aria-pressed', String(c === t))); return; }
    if (ds.start) { const v = num($('#start-in').value); if (!isNaN(v)) d.start = v; d.start = Math.max(0, roundTo(d.start + +ds.start * d.inc, d.inc)); $('#start-in').value = fmt(d.start); return; }
    if (ds.addinc) { d.inc = parseFloat(ds.addinc); document.querySelectorAll('[data-addinc]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
    if (ds.incstep) { const o = incOptions(state.unit); const i = Math.max(0, Math.min(o.length - 1, o.indexOf(d.inc) + +ds.incstep)); d.inc = o[i] ?? o[1]; $('#inc-out').innerHTML = `+${fmt(d.inc)}<small>${state.unit}</small>`; return; }
    if (ds.addrange) { d.range = ds.addrange; document.querySelectorAll('[data-addrange]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return; }
  }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'snap-in' && e.target.files?.[0]) {
    const f = e.target.files[0]; e.target.value = '';
    try { const { dataUrl, blob } = await compress(f); openSheet('add', { draft:{ photo:dataUrl } }); identify(blob); }
    catch { toast('That photo could not be read. Try another one.'); }
    return;
  }
  if (e.target.id === 'photo-in' && e.target.files?.[0]) {
    try { const { dataUrl, blob } = await compress(e.target.files[0]); sheet.draft.photo = dataUrl; drawSheet(false); identify(blob); }
    catch { toast('That photo could not be read. Try another one.'); }
  }
  if (e.target.id === 'rephoto' && e.target.files?.[0]) {
    try { const { dataUrl } = await compress(e.target.files[0]); const m = byId(sheet.id); m.photo = dataUrl; persist(m); drawSheet(false); render(); }
    catch { toast('That photo could not be read. Try another one.'); }
  }
  if (e.target.id === 'name-edit') {
    const m = byId(sheet.id); const v = e.target.value.trim();
    if (v && v !== m.name) { m.name = v; persist(m); render(); drawSheet(false); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheet) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'w-input') e.target.blur();
});

function doLog() {
  const m = byId(sheet.id), d = sheet.draft;
  const v = num($('#w-input').value); if (!isNaN(v) && v >= 0) d.w = v;
  const before = suggest(m).status;
  const entry = { id:uid(), t:Date.now(), w:d.w, sets:d.sets, reps:d.reps, effort:d.effort };
  m.sessions = (m.sessions || []).concat(entry);
  persist(m); closeSheet(); render();
  const next = suggest(m);
  const msg = next.status === 'up' ? `Logged. Next time go up to ${fmt(next.w)} ${m.unit}` :
              next.status === 'down' ? `Logged. Next time ${fmt(next.w)} ${m.unit}` :
              `Logged ${fmt(d.w)} ${m.unit} · ${d.sets}×${d.reps}`;
  toast(msg, () => { const mm = byId(m.id); if (!mm) return; mm.sessions = mm.sessions.filter(x => x.id !== entry.id); persist(mm); render(); });
  void before;
}
function saveMachine() {
  const d = sheet.draft;
  const sv = num($('#start-in')?.value); if (!isNaN(sv) && sv >= 0) d.start = sv;
  const name = ($('#name-in')?.value || d.name || '').trim();
  if (!name) { const n = $('#name-in'); n.focus(); n.placeholder = 'Give it a name, e.g. Leg Press'; return; }
  const r = RANGES.find(x => x.k === d.range) || RANGES[1];
  const now = Date.now();
  const m = { id:uid(), name, photo:d.photo || null, unit:state.unit, inc:d.inc, repMin:r.min, repMax:r.max, sets:3, start:d.start, createdAt:now,
    sessions:[{ id:uid(), t:now, w:d.start, sets:3, reps:Math.round((r.min + r.max) / 2), effort:2 }] };
  state.machines.push(m); persist(m);
  state.tab = 'machines';
  closeSheet(); render(); window.scrollTo({ top:0 });
  toast(`${name} saved at ${fmt(d.start)} ${m.unit}`, () => { removeMachine(m.id); render(); });
}
function switchUnit(u) {
  const f = u === 'lb' ? 2.20462 : 1 / 2.20462;
  const conv = (w, step) => Math.round(w * f / step) * step;
  state.machines.forEach(m => {
    if (m.unit === u) return;
    m.unit = u; m.start = conv(m.start, 0.5);
    m.inc = u === 'lb' ? ({1:2.5, 2.5:5, 5:10, 10:20}[m.inc] || 10) : ({2.5:1, 5:2.5, 10:5, 20:10}[m.inc] || 5);
    (m.sessions || []).forEach(s => s.w = conv(s.w, 0.5));
    persist(m);
  });
  state.unit = u; lsSet('plateup.unit', u); render();
  if (state.machines.length) toast(`Weights shown in ${u}`);
}

/* ---------- boot ---------- */
if (state.machines[0]?.unit) state.unit = state.machines[0].unit;
render();
connect();
})();
</script>
